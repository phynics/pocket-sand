name: PocketSand

options:
  bundleIdPrefix: dev.pocketsand
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KandevKit:
    path: Packages/KandevKit
  # An agent answers in markdown and arrives as markdown, and MarkdownUI draws the whole of it as
  # real SwiftUI views: headings, nested lists, fenced code, tables, thematic breaks. A single
  # `AttributedString`-backed `Text` carries bold and links but cannot express a table, which is
  # the case that decides it. View code only — it belongs to the app targets and never to
  # KandevKit, where the wire and the state live and nothing draws.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Approachable concurrency, on for both targets. The feature that earns its place is
    # `NonisolatedNonsendingByDefault`: a `nonisolated async` function runs on its caller's actor
    # instead of hopping to the global executor and back, so a chain of small async helpers stops
    # costing a suspension point per link — which is most of what this codebase's async work is.
    #
    # Measured before believing it: a clean build with the flag off emits 97 warnings, and a clean
    # build with it on emits the same 97. It costs nothing here. (An earlier claim in this repo that
    # the targets built warning-free was wrong: those checks were incremental builds, and an
    # incremental build that compiles nothing emits nothing.)
    #
    # KandevKit turns on the same feature in its own `Package.swift`, because a package cannot
    # inherit an Xcode build setting.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PocketSand-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/PocketSand
    dependencies:
      - package: KandevKit
        product: KandevKit
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        INFOPLIST_FILE: Apps/iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketsand.PocketSand
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []

  PocketSand-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/PocketSand
    dependencies:
      - package: KandevKit
        product: KandevKit
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        INFOPLIST_FILE: Apps/macOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketsand.PocketSand.macOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
