name: PocketSand

options:
  bundleIdPrefix: dev.pocketsand
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KandevKit:
    path: Packages/KandevKit
  # An agent answers in markdown and arrives as markdown, and MarkdownUI draws the whole of it as
  # real SwiftUI views: headings, nested lists, fenced code, tables, thematic breaks. A single
  # `AttributedString`-backed `Text` carries bold and links but cannot express a table, which is
  # the case that decides it. View code only — it belongs to the app targets and never to
  # KandevKit, where the wire and the state live and nothing draws.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PocketSand-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/PocketSand
    dependencies:
      - package: KandevKit
        product: KandevKit
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        INFOPLIST_FILE: Apps/iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketsand.PocketSand
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []

  PocketSand-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/PocketSand
    dependencies:
      - package: KandevKit
        product: KandevKit
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        INFOPLIST_FILE: Apps/macOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketsand.PocketSand.macOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
